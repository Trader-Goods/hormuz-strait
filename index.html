function tone(f,dt,dur,vol,type,f2){if(!AC||muted)return;const t0=AC.currentTime+(dt||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);env(g,t0,.01,vol,dur);o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+dur+.05)}

 flap(){if(!AC||muted)return;const t0=AC.currentTime,r=1+(Math.random()-.5)*.16,src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),dec=.18+Math.random()*.07;

const LGC=new Map();function lg(y0,y1,stops){const k=y0+'|'+y1+'|'+stops.join();let g=LGC.get(k);if(g)return g;if(LGC.size>400)LGC.clear();g=x.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));LGC.set(k,g);return g}

function poly(pts,fill,stroke){x.beginPath();x.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)x.lineTo(pts[i],pts[i+1]);x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=1.2;x.stroke()}}

function ensign(px,py,col){R(px,py-14,1.5,14,'#2a2a2a');const w=Math.sin(t/8)*1.2;poly([px+1.5,py-14,px+11,py-13+w,px+11,py-8+w,px+1.5,py-8],col,OL)}
function waterline(px,y,w){x.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<w;i+=7)x.fillRect(px+i,y+Math.sin((px+i+t*2)/9)*1,5,1.5)}
function shadow(px,y,w){x.fillStyle='rgba(0,15,30,.3)';x.beginPath();x.ellipse(px+w/2,y+3,w/2+4,4,0,0,7);x.fill()}

function hullShape(px,dy,w,h,col1,col2,boot){const g=lg(dy,dy+h,[col1,col2]);poly([px,dy,px+w,dy-2,px+w-h*.9,dy+h,px+6,dy+h],g,OL);if(boot){x.save();x.clip();R(px,dy+h-4,w,4,boot);x.restore()}}
function mine(cx,cy){x.strokeStyle='#1a1a1a';x.lineWidth=2;for(let a=0;a<8;a++){x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a*.785)*9,cy+Math.sin(a*.785)*9);x.stroke()}
 const g=x.createRadialGradient(cx-2,cy-2,1,cx,cy,7);g.addColorStop(0,'#6a6a6a');g.addColorStop(1,'#151515');x.fillStyle=g;x.beginPath();x.arc(cx,cy,6.5,0,7);x.fill();R(cx-.5,cy+6,1,6,'#333')}

  x.fillStyle='#55606b';x.beginPath();x.arc(px+40,wl-41,2.5,0,7);x.fill();
  R(px+62,wl-11,6,5,'#6c7782');R(px+66,wl-10,12,2,'#3a3f44');R(px+50,wl-13,3,1.5,'#222');
  x.fillStyle='#fff';x.font='bold 7px '+F;x.fillText('F'+(20+k*7%70),px+70,wl+3);ensign(px+4,wl-6,'#2a5d9f')}
 else if(type==='speed'){for(let i=0;i<2;i++){const ox=px+(i?18:0),oy=wl-(i?18:0)+Math.sin(t/7+i)*1.2;
  hullShape(ox+2,oy-4,w-24,8,'#f2efe6','#bdb6a4');R(ox+20,oy-11,15,7,'#2f3b2b');poly([ox+35,oy-11,ox+39,oy-4,ox+35,oy-4],'#9cc8e8');

   else if(m.st===1){m.w++;if(m.w>=m.wN){m.st=2;if(d>=150&&!cf.active&&!op.active){const vx=sp+1.5,fr=d/vx,tyg=Math.max(SEA+20,Math.min(BED-20,b.y-2));SFX.launch();msls.push({x:tx,y:ty,vx,vy:(tyg-ty)/fr,tr:[],dist:0})}}}}
  for(const m of msls){m.x-=m.vx;m.y+=m.vy;m.dist+=Math.hypot(m.vx-sp,m.vy)+sp;if(m.dist>250){m.dead=1;SFX.pop();puffs.push({x:m.x,y:m.y,f:0});continue}m.tr.unshift({x:m.x+8,y:m.y});for(const q of m.tr)q.x-=sp*.6;if(m.tr.length>26)m.tr.pop();
   if(m.x-6<PX+18&&m.x+6>PX-20&&m.y-2<b.y+2&&m.y+2>b.y-7)over()}
  msls=msls.filter(m=>!m.dead&&m.x>-60);for(const q of puffs){q.f++;q.x-=sp}puffs=puffs.filter(q=>q.f<30);
  obs=obs.filter(o=>o.x>-100);if(b.y+9>BED||b.y-9<SEA)over();
  while(st==='play'&&lastSc<sc){lastSc++;gainOil(1);if(lastSc===25)gainOil(10,1);if(lastSc===50)gainOil(50,1);if(lastSc===100)gainOil(200,1);if(lastSc===200){gainOil(500,1);st='win';SFX.fanfare();msls=[];winT=0;obs=[];endRun(best);if(sc>best){best=sc;try{localStorage.setItem('hzBest',best)}catch(e){}}}}}}
// ---- passability: limit vertical change between consecutive gaps using real physics
function simMove(N,flapEvery){let y=0,v=0;for(let i=0;i<N;i++){if(flapEvery&&i%flapEvery==0)v=FLAP;v=Math.min(v+GRAV,MAXF);y+=v}return y}
function simRise(N){let best=0;for(const k of[6,8,10,12]){best=Math.max(best,-simMove(N,k))}return best}
function nextGapY(gap,spacing,spd){const lo=SEA+40,hi=BED-40-gap;let g=lo+Math.random()*(hi-lo);
 if(lastG!==null){const N=Math.floor((spacing-OW-42)/spd),slack=gap-13-24,maxDown=.75*(simMove(N,0)+slack),maxUp=.75*(simRise(N)+slack);
  g=Math.max(lastG-maxUp,Math.min(lastG+maxDown,g))}
 g=Math.max(lo,Math.min(hi,g));lastG=g;return g}
let last=performance.now(),acc=0;
function drawInterp(al){// render-only interpolation between the last two fixed steps (physics untouched)
 const mv=st==='play'?sp:st==='start'?S0*.5:0,off=mv*(1-al),y0=b.y,d0=dist;b.y=prevY+(y0-prevY)*al;dist-=off;
 for(const o of obs)o.x+=off;for(const m of msls)m.x+=off;for(const q of puffs)q.x+=off;for(let i=1;i<foam.length;i++)foam[i].x+=off;const fy=foam.length?foam[0].y:0;if(foam.length)foam[0].y=b.y+9;
 try{draw()}finally{b.y=y0;dist=d0;for(const o of obs)o.x-=off;for(const m of msls)m.x-=off;for(const q of puffs)q.x-=off;for(let i=1;i<foam.length;i++)foam[i].x-=off;if(foam.length)foam[0].y=fy}}
let loopErr=false;function loop(now){try{acc+=Math.min(100,Math.max(0,now-last));last=now;while(acc>=STEP){update();acc-=STEP}drawInterp(st==='play'||st==='start'?acc/STEP:1)}catch(e){acc=0;if(!loopErr){loopErr=true;console.warn('Hormuz frame error (recovered):',e)}}requestAnimationFrame(loop)}
