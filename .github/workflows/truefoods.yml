name: TrueFoods

on:
  push:
    branches:
      - truefoods-app
  workflow_dispatch:

jobs:
  testflight:
    name: Build, sign and upload to TestFlight
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[groups-only]') }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      TEAM_ID: 35734G7ZCQ
      BUNDLE_ID: com.tradergoods.madewithlove
      ASC_APP_ID: "6833977562"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Unit tests
        timeout-minutes: 25
        run: bash TrueFoods/ci/run_unit_tests.sh

      - name: Write API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          BODY=$(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          chmod 600 "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Prepare App Store certificate and profile
        env:
          KID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISS: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 TrueFoods/ci/prepare_appstore_signing.py

      - name: Archive (manual App Store signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project TrueFoods/TrueFoods.xcodeproj \
            -scheme TrueFoods \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TrueFoods.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportIPA.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TrueFoods.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportIPA.plist"
          IPA=$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p artifacts
          cp "$IPA" artifacts/TrueFoods.ipa
          ls -lh artifacts/TrueFoods.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TrueFoods-ipa
          path: artifacts/TrueFoods.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          KID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISS: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>upload</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TrueFoods.xcarchive" \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KID" \
            -authenticationKeyIssuerID "$ISS"

      - name: Add build to Me and Family and Friends
        env:
          KID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISS: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 TrueFoods/ci/assign_testflight_group.py

      - name: Revoke this run's distribution certificate
        if: success()
        env:
          KID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISS: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 TrueFoods/ci/prepare_appstore_signing.py revoke

      - name: Remove signing material
        if: always()
        run: |
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/signing"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  screenshots:
    name: Capture simulator screenshots
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Build and capture
        run: bash TrueFoods/ci/capture_screenshots.sh "$GITHUB_WORKSPACE/artifacts/screenshots"

      - uses: actions/upload-artifact@v4
        with:
          name: truefoods-screenshots
          path: artifacts/screenshots
          if-no-files-found: error

  groups:
    name: Add build 1 to Family and Friends
    if: contains(github.event.head_commit.message, '[groups-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUNDLE_ID: com.tradergoods.madewithlove
      BUILD_NUMBER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Write API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          BODY=$(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          chmod 600 "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Add build 1 to Me and Family and Friends
        env:
          KID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISS: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 TrueFoods/ci/assign_testflight_group.py

      - name: Remove API key
        if: always()
        run: rm -rf "$HOME/private_keys"
