name: iOS

on:
  push:
    branches:
      - ios-app
  workflow_dispatch:

jobs:
  unsigned-build:
    name: Unsigned iOS build
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci

      - name: Copy the game into the iOS project
        working-directory: app
        run: npx cap sync ios

      - name: Compile an unsigned simulator build
        working-directory: app/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # TODO: Signing and TestFlight upload.
      # This step is skipped so the unsigned compile above can pass on its own.
      # Remove `if: false` after these repository secrets exist:
      #   APP_STORE_CONNECT_KEY_ID
      #   APP_STORE_CONNECT_ISSUER_ID
      #   APP_STORE_CONNECT_PRIVATE_KEY  (contents of the AuthKey .p8 file)
      # Automatic signing uses `xcodebuild -allowProvisioningUpdates` or fastlane.
      - name: "TODO: sign and upload to TestFlight"
        if: false
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          # Archive with automatic signing. A fastlane lane can replace this
          # block: app_store_connect_api_key(key_id:, issuer_id:, key_content:)
          # then build_app(..., export_method: "app-store").
          xcodebuild \
            -project app/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HormuzStrait.xcarchive" \
            -allowProvisioningUpdates \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST
          # Export and upload to TestFlight. Equivalent fastlane call:
          # upload_to_testflight
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/HormuzStrait.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/"*.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
