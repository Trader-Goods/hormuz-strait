name: Live to Still

on:
  push:
    branches:
      - livetostill-app
  workflow_dispatch:

jobs:
  testflight:
    name: Build, sign and upload to TestFlight
    runs-on: macos-15-intel
    env:
      TEAM_ID: 35734G7ZCQ
      BUNDLE_ID: com.tradergoods.livetostill
    steps:
      - uses: actions/checkout@v4

      - name: Write API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          BODY=$(printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          chmod 600 "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Prepare App Store certificate and profile
        env:
          KID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISS: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: python3 scripts/prepare_appstore_signing.py

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Archive (manual App Store signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project LiveToStill.xcodeproj \
            -scheme LiveToStill \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LiveToStill.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportIPA.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LiveToStill.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportIPA.plist"
          IPA=$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p artifacts
          cp "$IPA" artifacts/LiveToStill.ipa
          ls -lh artifacts/LiveToStill.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LiveToStill-ipa
          path: artifacts/LiveToStill.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          KID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISS: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>upload</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LiveToStill.xcarchive" \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KID" \
            -authenticationKeyIssuerID "$ISS"

      - name: Remove signing material
        if: always()
        run: |
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/signing"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
